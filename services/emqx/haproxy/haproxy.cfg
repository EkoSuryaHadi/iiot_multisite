global
    maxconn 4096
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 2m
    timeout server 2m
    retries 3

# --- MQTT (TCP) ---
frontend mqtt_in
    bind *:1883
    mode tcp
    default_backend mqtt_back

backend mqtt_back
    mode tcp
    balance roundrobin
    option tcp-check
    server emqx1 emqx1:1883 check inter 5s fall 2 rise 2
    server emqx2 emqx2:1883 check inter 5s fall 2 rise 2
    server emqx3 emqx3:1883 check inter 5s fall 2 rise 2

# --- MQTT over TLS (TCP) ---
frontend mqtts_in
    bind *:8883
    mode tcp
    default_backend mqtts_back

backend mqtts_back
    mode tcp
    balance roundrobin
    option tcp-check
    server emqx1 emqx1:8883 check inter 5s fall 2 rise 2
    server emqx2 emqx2:8883 check inter 5s fall 2 rise 2
    server emqx3 emqx3:8883 check inter 5s fall 2 rise 2

# --- MQTT over WebSocket (TCP passthrough) ---
frontend ws_in
    bind *:8083
    mode tcp
    default_backend ws_back

backend ws_back
    mode tcp
    balance roundrobin
    option tcp-check
    server emqx1 emqx1:8083 check inter 5s fall 2 rise 2
    server emqx2 emqx2:8083 check inter 5s fall 2 rise 2
    server emqx3 emqx3:8083 check inter 5s fall 2 rise 2

# --- Dashboard / REST API (HTTP) ---
frontend dashboard_in
    bind *:18083
    mode http
    default_backend dashboard_back

backend dashboard_back
    mode http
    balance roundrobin
    option httpchk GET /api/v5/status
    http-check expect status 200
    server emqx1 emqx1:18083 check inter 5s fall 2 rise 2
    server emqx2 emqx2:18083 check inter 5s fall 2 rise 2
    server emqx3 emqx3:18083 check inter 5s fall 2 rise 2

# --- Statistik HAProxy (opsional, untuk observasi failover) ---
listen stats
    bind *:9000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
